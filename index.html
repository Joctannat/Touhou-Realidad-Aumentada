<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touhou RA</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- MindAR para A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Nombres de los modelos -->
      <a-asset-item id="modelo0" src="./cirno.glb"></a-asset-item>
      <a-asset-item id="modelo1" src="./flan.glb"></a-asset-item>
      <a-asset-item id="modelo2" src="./keiki.glb"></a-asset-item>
      <a-asset-item id="modelo3" src="./ran.glb"></a-asset-item>
      <a-asset-item id="modelo4" src="./reimu.glb"></a-asset-item>
      <a-asset-item id="modelo5" src="./remi.glb"></a-asset-item>
      <a-asset-item id="modelo6" src="./sakuya.glb"></a-asset-item>
      <a-asset-item id="modelo7" src="./suwako.glb"></a-asset-item>
      <a-asset-item id="modelo8" src="./tsukasa.glb"></a-asset-item>
      <a-asset-item id="modelo9" src="./utsuho.glb"></a-asset-item>
      <a-asset-item id="modelo10" src="./yuyu.glb"></a-asset-item>
    </a-assets>

    <!-- camara -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- modelo 0 -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#modelo0" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

    <!-- modelo 1 -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model src="#modelo1" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

    <!-- modelo 2 -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model src="#modelo2" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

    <!-- modelo 3 -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-gltf-model src="#modelo3" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

    <!-- modelo 4 -->
    <a-entity mindar-image-target="targetIndex: 4">
      <a-gltf-model src="#modelo4" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

    <!-- modelo 5 -->
    <a-entity mindar-image-target="targetIndex: 5">
      <a-gltf-model src="#modelo5" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

    <!-- modelo 6 -->
    <a-entity mindar-image-target="targetIndex: 6">
      <a-gltf-model src="#modelo6" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

    <!-- modelo 7 -->
    <a-entity mindar-image-target="targetIndex: 7">
      <a-gltf-model src="#modelo7" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

    <!-- modelo 8 -->
    <a-entity mindar-image-target="targetIndex: 8">
      <a-gltf-model src="#modelo8" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

    <!-- modelo 9 -->
    <a-entity mindar-image-target="targetIndex: 9">
      <a-gltf-model src="#modelo9" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

    <!-- modelo 10 -->
    <a-entity mindar-image-target="targetIndex: 10">
      <a-gltf-model src="#modelo10" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
