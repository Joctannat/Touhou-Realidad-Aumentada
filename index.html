<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touhou RA</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- MindAR para A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Nombres de los modelos -->
      <a-asset-item id="modelo0" src="./cirno.glb"></a-asset-item>
      <a-asset-item id="modelo1" src="./flan.glb"></a-asset-item>
      <a-asset-item id="modelo3" src="./ran.glb"></a-asset-item>
      <a-asset-item id="modelo5" src="./remi.glb"></a-asset-item>
      <a-asset-item id="modelo6" src="./sakuya.glb"></a-asset-item>
      <a-asset-item id="modelo7" src="./suwako.glb"></a-asset-item>
      <a-asset-item id="modelo8" src="./tsukasa.glb"></a-asset-item>
      <a-asset-item id="modelo9" src="./utsuho.glb"></a-asset-item>
    </a-assets>

    <!-- camara -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- cirno -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#modelo0" position="-0.5 0 0" rotation="0 135 0" scale="0.04 0.04 0.04""></a-gltf-model>
    </a-entity>

    <!-- flandre -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model src="#modelo1" position="0 -0.9 0" rotation="0 -38 0" scale="0.07 0.07 0.07"></a-gltf-model>
    </a-entity>


    <!-- ran -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-gltf-model src="#modelo3" position="0 0 0" rotation="0 0 0" scale="6 6 6"></a-gltf-model>
    </a-entity>

    <!-- remilia -->
    <a-entity mindar-image-target="targetIndex: 5">
      <a-gltf-model src="#modelo5" position="0 0.49 0" rotation="90 171 0" scale="0.09 0.09 0.09"></a-gltf-model>
    </a-entity>

    <!-- sakuya -->
    <a-entity mindar-image-target="targetIndex: 6">
      <a-gltf-model src="#modelo6" position="0 0 0" rotation="0 0 0" scale="2.5 2.5 2.5"></a-gltf-model>
    </a-entity>

    <!-- suwako -->
    <a-entity mindar-image-target="targetIndex: 7">
      <a-gltf-model src="#modelo7" position="0 -0.9 0" rotation="0 -65 0" scale="0.030 0.030 0.030"></a-gltf-model>
    </a-entity>

    <!-- tsukasa -->
    <a-entity mindar-image-target="targetIndex: 8">
      <a-gltf-model src="#modelo8" position="0 0.15 0" rotation="0 -74 0" scale="0.045 0.045 0.045"></a-gltf-model>
    </a-entity>

    <!-- utsuho -->
    <a-entity mindar-image-target="targetIndex: 9">
      <a-gltf-model src="#modelo9" position="0 -0.9 0" rotation="0 -95 0" scale="3.2 3.2 3.2"></a-gltf-model>
    </a-entity>


  </a-scene>
<a-entity light="type: ambient; color: #BBB"></a-entity>
</body>
</html>
